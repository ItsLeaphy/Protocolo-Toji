<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protocolos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Manrope:wght@700&family=Fraunces:ital,opsz,wght@1,9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0B0A0C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Protocolos">
<style>
  :root {
    --void: #0B0A0C;
    --hair: rgba(255,255,255,0.14);
    --ink: #EDEAE4;
  }
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--void);
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
  }
  .instrucao {
    position: fixed;
    top: calc(1.1rem + env(safe-area-inset-top, 0px));
    left: 0; right: 0;
    text-align: center;
    color: rgba(237,234,228,0.55);
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    z-index: 5;
    pointer-events: none;
  }
  .portais {
    display: flex;
    height: 100vh;
    height: 100dvh;
  }
  .portal {
    position: relative;
    flex: 1;
    display: flex;
    align-items: flex-end;
    padding: 0 0 3.5rem;
    justify-content: center;
    border-left: 1px solid var(--hair);
    background: var(--void);
    cursor: pointer;
    color: inherit;
    font: inherit;
    text-align: center;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .portal:first-child { border-left: none; }
  .portal::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--wash);
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .portal:hover::before,
  .portal:focus-visible::before {
    opacity: 1;
  }
  .portal .rotulo {
    position: relative;
    z-index: 2;
  }
  .portal .nome {
    display: block;
    font-size: clamp(1.6rem, 6vw, 3rem);
    color: rgba(237,234,228,0.4);
    transition: color 0.35s ease, transform 0.35s ease;
  }
  .portal:hover .nome,
  .portal:focus-visible .nome {
    color: var(--ink);
    transform: translateY(-0.3rem);
  }
  .portal .quem {
    display: block;
    margin-top: 0.5rem;
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    color: rgba(237,234,228,0.3);
    transition: color 0.35s ease;
  }
  .portal:hover .quem,
  .portal:focus-visible .quem {
    color: rgba(237,234,228,0.75);
  }
  .portal:focus-visible { outline: 1px solid rgba(237,234,228,0.6); outline-offset: -6px; }

  #toji .nome { font-family: 'Space Grotesk', sans-serif; }
  #toji { --wash: radial-gradient(ellipse at 50% 120%, rgba(176,35,28,0.55), transparent 70%); }

  #megumi .nome { font-family: 'Manrope', sans-serif; }
  #megumi { --wash: radial-gradient(ellipse at 50% 120%, rgba(140,170,201,0.45), transparent 70%); }

  #maki .nome { font-family: 'Fraunces', serif; font-style: italic; }
  #maki { --wash: radial-gradient(ellipse at 50% 120%, rgba(200,30,92,0.5), transparent 70%); }

  .rodape {
    position: fixed;
    bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
    left: 0; right: 0;
    text-align: center;
    color: rgba(237,234,228,0.4);
    font-size: 0.75rem;
    z-index: 5;
    pointer-events: none;
  }
  #instalar {
    position: fixed;
    bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
    right: 1.1rem;
    z-index: 6;
    background: transparent;
    color: rgba(237,234,228,0.55);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 6px;
    padding: 0.45rem 0.8rem;
    font: inherit;
    font-size: 0.75rem;
    cursor: pointer;
    display: none;
  }
  #instalar:hover, #instalar:focus-visible {
    color: var(--ink);
    border-color: rgba(255,255,255,0.6);
  }

  @media (max-width: 640px) {
    .portais { flex-direction: column; }
    .portal { border-left: none; border-top: 1px solid var(--hair); align-items: center; padding-bottom: 0; }
    .portal:first-child { border-top: none; }
  }
</style>
</head>
<body>
  <p class="instrucao">escolhe o seu — fica salvo pra próxima vez</p>

  <div class="portais">
    <button class="portal" id="toji" onclick="escolher('toji')">
      <span class="rotulo"><span class="nome">TOJI</span><span class="quem">Dani</span></span>
    </button>
    <button class="portal" id="megumi" onclick="escolher('megumi')">
      <span class="rotulo"><span class="nome">Megumi</span><span class="quem">Diego</span></span>
    </button>
    <button class="portal" id="maki" onclick="escolher('maki')">
      <span class="rotulo"><span class="nome">Maki</span><span class="quem">Helena</span></span>
    </button>
  </div>

  <button id="instalar" type="button">Instalar</button>

<script>
  // Sem redirecionamento automático — essa página sempre mostra os três portais.
  // Pra sempre abrir direto no mesmo protocolo, favorita o link dele (ex: docs/toji/)
  // em vez deste índice. Isso evita qualquer beco sem saída.
  function escolher(protocolo) {
    location.href = './' + protocolo + '/';
  }

  // --- PWA: manifest + service worker via Blob (só funciona em host real, não em preview) ---
  (function () {
    var icone = 'data:image/svg+xml,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
      '<rect width="100" height="100" fill="%230B0A0C"/>' +
      '<text x="50" y="62" font-family="sans-serif" font-size="46" font-weight="700" ' +
      'fill="%23EDEAE4" text-anchor="middle">P</text></svg>'
    );

    var manifest = {
      name: 'Protocolos',
      short_name: 'Protocolos',
      start_url: './',
      scope: './',
      display: 'standalone',
      background_color: '#0B0A0C',
      theme_color: '#0B0A0C',
      icons: [
        { src: icone, sizes: '192x192', type: 'image/svg+xml' },
        { src: icone, sizes: '512x512', type: 'image/svg+xml' }
      ]
    };
    try {
      var manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      var link = document.createElement('link');
      link.rel = 'manifest';
      link.href = URL.createObjectURL(manifestBlob);
      document.head.appendChild(link);

      var touchIcon = document.createElement('link');
      touchIcon.rel = 'apple-touch-icon';
      touchIcon.href = icone;
      document.head.appendChild(touchIcon);
    } catch (e) { console.warn('Manifest via Blob falhou:', e); }

    if ('serviceWorker' in navigator) {
      var swCode =
        "self.addEventListener('install', function(e){ self.skipWaiting(); });" +
        "self.addEventListener('activate', function(e){ self.clients.claim(); });" +
        "self.addEventListener('fetch', function(e){ e.respondWith(fetch(e.request).catch(function(){ return new Response('offline'); })); });";
      try {
        var swBlob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob))
          .catch(function (err) { console.warn('Service worker falhou:', err); });
      } catch (e) { console.warn('SW via Blob falhou:', e); }
    }

    var eventoInstalar = null;
    var botao = document.getElementById('instalar');
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      eventoInstalar = e;
      botao.style.display = 'block';
    });
    botao.addEventListener('click', function () {
      if (!eventoInstalar) return;
      eventoInstalar.prompt();
      eventoInstalar.userChoice.finally(function () {
        eventoInstalar = null;
        botao.style.display = 'none';
      });
    });
    window.addEventListener('appinstalled', function () {
      botao.style.display = 'none';
    });
  })();
</script>
</body>
</html>
